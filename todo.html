
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List V2</title>

    <link rel="stylesheet" href="todo.css">
</head>
<body>

    <div class="container">

        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your daily tasks</p>

        <!-- Add Task Section -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <button id="addBtn" onclick="addTask()">
                Add Task
            </button>

        </div>

       
        <div class="task-counts">

            <div class="count-box">
                <h3 id="totalCount">0</h3>
                <p>Total</p>
            </div>

            <div class="count-box">
                <h3 id="completedCount">0</h3>
                <p>Completed</p>
            </div>

            <div class="count-box">
                <h3 id="pendingCount">0</h3>
                <p>Pending</p>
            </div>

        </div>

        
        <div class="filter-section">

            <button onclick="filterTasks('all')">
                All Tasks
            </button>

            <button onclick="filterTasks('active')">
                Active
            </button>

            <button onclick="filterTasks('completed')">
                Completed
            </button>

        </div>

      
        <ul id="taskList"></ul>

        <button class="clear-btn" onclick="clearAllTasks()">
            Clear All Tasks
        </button>

    </div>

    <script src="todo.js"></script>

</body>
</html>
